name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Pin npm
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Validate package, variants and consumer statically
        run: node scripts/validate-fixtures.mjs
      - name: Inspect base package without lifecycle scripts
        run: npm pack ./packages/drill-canary --dry-run --ignore-scripts
