name: Drill publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fixed drill version to publish
        required: true
        type: choice
        options:
          - '0.1.0'
          - '0.1.1'
          - '0.1.2'
          - '0.2.0'
          - '0.2.1'

permissions:
  contents: read

concurrency:
  group: drill-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: drill
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - name: Pin npm
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Validate fixtures
        run: node scripts/validate-fixtures.mjs
      - name: Prepare allowlisted version
        env:
          DRILL_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-package.mjs "$DRILL_VERSION"
      - name: Inspect publish contents without lifecycle scripts
        run: npm pack ./dist --dry-run --ignore-scripts
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DRILL_TOKEN }}
        run: npm publish ./dist --access public --ignore-scripts --registry=https://registry.npmjs.org/
